name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: 构建（自动执行前端安装与构建）
        run: wails build -platform windows/amd64 -ldflags "-s -w"
      - name: 打包便携版 zip
        shell: pwsh
        run: |
          $zip = "Panoramix-${{ github.ref_name }}-windows-amd64.zip"
          Compress-Archive -Path build/bin/Panoramix.exe -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 创建 Release 草稿
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.ZIP_NAME }}
          body: |
            Windows 便携版：下载 zip 解压后直接运行 Panoramix.exe。

            > SmartScreen 提示"未知发布者"属正常现象（v0.x 未购买代码签名证书），
            > 点击「更多信息 → 仍要运行」即可。

            详细的里程碑验收清单见仓库 ROADMAP.md。
