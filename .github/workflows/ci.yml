name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: go vet
        run: go vet ./...
      - name: go test（含 SFTP/SSH 端到端用例）
        run: go test ./... -timeout 300s

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npx vue-tsc --noEmit
      - name: 构建
        run: npm run build

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Windows 交叉编译校验
        run: go build -o build/bin/Panoramix-ci.exe .
